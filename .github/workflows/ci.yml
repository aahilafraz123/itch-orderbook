name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / Release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        # OB_NATIVE=OFF: CI runners vary, and -march=native results aren't comparable anyway.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOB_NATIVE=OFF -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build
      - name: Unit + differential tests
        # Includes the differential test of every optimized book against the
        # reference book on synthetic streams (the real-data test self-skips).
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOB_SANITIZE=ON -DOB_NATIVE=OFF -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Tests under sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  docker:
    name: Docker image builds and tests pass
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: docker build (runs ctest inside)
        run: docker build --target test -t itch-orderbook:ci .
